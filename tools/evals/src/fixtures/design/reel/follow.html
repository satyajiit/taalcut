<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"text","type":"string","label":"Words","default":"Follow for more"}]'
>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="follow-template">
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        #card {
          position: absolute;
          left: 0;
          right: 0;
          top: 1480px;
          margin: 0 auto;
          width: fit-content;
          max-width: 720px;
          padding: 22px 48px;
          border-radius: 999px;
          background: #22c55e;
        }
        #words {
          margin: 0;
          font-family: 'Poppins', sans-serif;
          font-size: 56px;
          font-weight: 700;
          line-height: 1.2;
          color: #0b1b10;
          white-space: nowrap;
        }
      </style>
      <div id="root" data-composition-id="follow" data-width="1080" data-height="1920" data-duration="3">
        <div id="card">
          <p id="words" data-var-text="text">Follow for more</p>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.addLabel('enter', 0);
        tl.from('#card', { opacity: 0, scale: 0.8, duration: 0.35, ease: 'back.out(1.6)' }, 0);
        tl.addLabel('exit', 2.6);
        tl.to('#card', { opacity: 0, duration: 0.3, ease: 'power2.in' }, 'exit');
        window.__timelines['follow'] = tl;
      </script>
    </template>
  </body>
</html>
