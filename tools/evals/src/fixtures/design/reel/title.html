<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"text","type":"string","label":"Words","default":"Golden hour market"}]'
>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="title-template">
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        #card {
          position: absolute;
          left: 0;
          right: 0;
          top: 820px;
          margin: 0 auto;
          width: fit-content;
          max-width: 980px;
          padding: 24px 44px;
          border-radius: 10px;
          background: #ffd23f;
        }
        #words {
          margin: 0;
          font-family: 'Poppins', sans-serif;
          font-size: 84px;
          font-weight: 800;
          line-height: 1.2;
          color: #111111;
          white-space: nowrap;
        }
      </style>
      <div id="root" data-composition-id="title" data-width="1080" data-height="1920" data-duration="3">
        <div id="card">
          <p id="words" data-var-text="text">Golden hour market</p>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.addLabel('enter', 0);
        tl.from('#card', { opacity: 0, scale: 0.6, duration: 0.4, ease: 'back.out(1.8)' }, 0);
        tl.addLabel('exit', 2.6);
        tl.to('#card', { opacity: 0, duration: 0.3, ease: 'power2.in' }, 'exit');
        window.__timelines['title'] = tl;
      </script>
    </template>
  </body>
</html>
