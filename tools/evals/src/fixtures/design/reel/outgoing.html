<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"text","type":"string","label":"Words","default":"On my way!"}]'
>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="outgoing-template">
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        #card {
          position: absolute;
          right: 80px;
          top: 820px;
          width: fit-content;
          max-width: 720px;
          padding: 28px 40px;
          border-radius: 44px;
          background: #2f6df6;
        }
        #words {
          margin: 0;
          font-family: 'Poppins', sans-serif;
          font-size: 54px;
          font-weight: 500;
          line-height: 1.2;
          color: #ffffff;
          white-space: nowrap;
        }
      </style>
      <div id="root" data-composition-id="outgoing" data-width="1080" data-height="1920" data-duration="3">
        <div id="card">
          <p id="words" data-var-text="text">On my way!</p>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.addLabel('enter', 0);
        tl.from('#card', { opacity: 0, scale: 0.8, duration: 0.35, ease: 'back.out(1.6)' }, 0);
        tl.addLabel('exit', 2.6);
        tl.to('#card', { opacity: 0, duration: 0.3, ease: 'power2.in' }, 'exit');
        window.__timelines['outgoing'] = tl;
      </script>
    </template>
  </body>
</html>
