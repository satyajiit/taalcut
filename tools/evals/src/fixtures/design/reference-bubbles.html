<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"text","type":"string","label":"Words","default":"Made-up question here?"}]'
>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="incoming-template">
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        #bubble {
          position: absolute;
          left: 65px;
          top: 730px;
          width: fit-content;
          max-width: 900px;
          padding: 20px 34px;
          border-radius: 32px 32px 32px 8px;
          background: #ffffff;
          box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18);
          transform-origin: 0% 100%;
        }
        #words {
          margin: 0;
          font-family: 'Noto Sans', sans-serif;
          font-size: 52px;
          font-weight: 400;
          line-height: 1.2;
          color: #111111;
          white-space: nowrap;
        }
      </style>
      <div id="root" data-composition-id="incoming" data-width="1080" data-height="1920" data-duration="3">
        <div id="bubble">
          <p id="words" data-var-text="text">Made-up question here?</p>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.from('#bubble', { scale: 0.4, opacity: 0, duration: 0.12, ease: 'back.out(2)' }, 0);
        tl.addLabel('enter', 0.12);
        tl.addLabel('exit', 3);
        window.__timelines['incoming'] = tl;
      </script>
    </template>
  </body>
</html>
