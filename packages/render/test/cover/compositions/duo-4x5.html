<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"first","type":"string","label":"First word","default":"Dusk"},{"id":"second","type":"string","label":"Second word","default":"Dawn"},{"id":"kicker","type":"string","label":"Kicker","default":"Same ridge, nine hours apart"}]'
>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="cover-duo-template">
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #0b0d14;
        }
        .shot {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
        #after {
          clip-path: polygon(0 742px, 100% 598px, 100% 100%, 0 100%);
        }
        #seam {
          position: absolute;
          left: -40px;
          top: 664px;
          width: 1160px;
          height: 10px;
          background: #f6f1e7;
          transform: rotate(-7.6deg);
        }
        #first,
        #second {
          position: absolute;
          left: 80px;
          margin: 0;
          font-family: 'Anton', sans-serif;
          font-size: 290px;
          line-height: 0.9;
          text-transform: uppercase;
          letter-spacing: 0.01em;
        }
        #first {
          top: 330px;
          color: transparent;
          -webkit-text-stroke: 5px #f6f1e7;
        }
        #second {
          top: 742px;
          color: #f6f1e7;
        }
        #kicker {
          position: absolute;
          left: 86px;
          right: 180px;
          top: 1044px;
          margin: 0;
          font-family: 'Poppins', sans-serif;
          font-size: 52px;
          font-weight: 600;
          line-height: 1.12;
          color: #f6f1e7;
        }
      </style>
      <div id="root" data-composition-id="cover-duo" data-width="1080" data-height="1350" data-duration="2">
        <img class="shot" id="before" data-picture="dusk" alt="" />
        <img class="shot" id="after" data-picture="dawn" alt="" />
        <div id="seam"></div>
        <p id="first" data-var-text="first">Dusk</p>
        <p id="second" data-var-text="second">Dawn</p>
        <p id="kicker" data-var-text="kicker">Same ridge, nine hours apart</p>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.addLabel('enter', 0);
        tl.addLabel('exit', 1.5);
        window.__timelines['cover-duo'] = tl;
      </script>
    </template>
  </body>
</html>
