<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"title","type":"string","label":"Title","default":"Leave"},{"id":"accent","type":"color","label":"Accent","default":"#f4b63f"}]'
>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="title-a-template">
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        #stack {
          position: absolute;
          left: 96px;
          bottom: 420px;
          display: flex;
          flex-direction: column;
          gap: 16px;
          max-width: 820px;
        }
        #rule {
          width: 96px;
          height: 8px;
          background: var(--accent);
          transform-origin: left center;
        }
        #title {
          margin: 0;
          font-family: 'Anton', sans-serif;
          font-size: 168px;
          line-height: 1;
          text-transform: uppercase;
          color: #fdf8ee;
          text-shadow: 0 2px 6px rgba(20, 14, 6, 0.6);
          text-wrap: balance;
        }
      </style>
      <div id="root" data-composition-id="title-a" data-width="1080" data-height="1920" data-duration="3">
        <div id="stack">
          <div id="rule"></div>
          <p id="title" data-var-text="title">Leave</p>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.addLabel('enter', 0);
        tl.from('#rule', { scaleX: 0, duration: 0.3, ease: 'power3.out' }, 0);
        tl.from('#title', { x: -80, opacity: 0, duration: 0.45, ease: 'expo.out' }, 0.08);
        tl.addLabel('exit', 2.6);
        tl.to('#stack', { x: -60, opacity: 0, duration: 0.3, ease: 'power2.in' }, 'exit');
        window.__timelines['title-a'] = tl;
      </script>
    </template>
  </body>
</html>
