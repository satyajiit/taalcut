<!doctype html>
<html
  lang="en"
>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="kfarray-template">
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        #badge {
          position: absolute;
          left: 200px;
          top: 800px;
          width: 220px;
          height: 220px;
          border-radius: 50%;
          background: #ff6b6b;
        }
      </style>
      <div id="root" data-composition-id="kfarray" data-width="1080" data-height="1920" data-duration="4">
        <div id="badge"></div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.to('#badge', { keyframes: [{ x: 300, duration: 1 }, { y: 400, duration: 0.8, ease: 'power2.out' }, { rotation: 90, scale: 0.6 }] }, 0.3);
        window.__timelines['kfarray'] = tl;
      </script>
    </template>
  </body>
</html>
