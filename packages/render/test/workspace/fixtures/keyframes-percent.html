<!doctype html>
<html
  lang="en"
>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="kfpercent-template">
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        #tile {
          position: absolute;
          left: 340px;
          top: 760px;
          width: 400px;
          height: 400px;
          border-radius: 48px;
          background: #4361ee;
        }
      </style>
      <div id="root" data-composition-id="kfpercent" data-width="1080" data-height="1920" data-duration="4">
        <div id="tile"></div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.to('#tile', { keyframes: { '0%': { scale: 0.4 }, '40%': { scale: 1.1, ease: 'power2.out' }, '70%': { rotation: 20 }, '100%': { scale: 1, rotation: 0, opacity: 0.6 }, easeEach: 'sine.inOut' }, duration: 3 }, 0.5);
        window.__timelines['kfpercent'] = tl;
      </script>
    </template>
  </body>
</html>
