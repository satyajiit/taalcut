# Builds site/v0 and deploys GitHub Pages. Runs on push to main, workflow_dispatch,
# and workflow_call from moderate.yml. A GITHUB_TOKEN commit does not start other
# workflows, so moderate.yml calls this file itself.
# Every action is pinned by commit SHA (the tag it was is in the comment beside it).
name: publish-index
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build the index
        run: node scripts/build-index.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
