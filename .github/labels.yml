# Triage labels, applied to the repository by hand (gh label create) from this list.

- name: "type: bug"
  color: "#d73a4a"
  description: "Something in this build did the wrong thing."

- name: "type: feature"
  color: "#a371f7"
  description: "A change to what Taalcut can do."

- name: "type: docs"
