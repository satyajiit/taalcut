- name: "priority: p0"
  color: "#b60205"
  description: "Blocks a release, with no workaround."

- name: "priority: p1"
  color: "#fbca04"
  description: "Hurts a release. A workaround exists."

- name: "priority: p2"
  color: "#c5def5"
  description: "Worth doing. Does not block a release."

- name: "needs-repro"
  color: "#e4e669"
  description: "Needs steps that show the problem again."

- name: "good first issue"
  color: "#7057ff"
  description: "Small and bounded enough for a first change."

- name: "blocks-export"
  color: "#f9d0c4"
  description: "Stops an export from finishing or being saved."
