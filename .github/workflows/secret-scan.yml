name: Secret scan

# Full git history, not the working tree. The binary is the MIT gitleaks CLI,
# pinned and checksummed. Not gitleaks-action: that action's licence is not MIT.
# Release: https://github.com/gitleaks/gitleaks/releases/tag/v8.30.1
# Every run scans every ref (--log-opts=--all), so a pull request also re-checks
# history. The weekly run covers commits that reach a branch without a pull
# request (a schedule runs on the default branch with every ref fetched).
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version="8.30.1"
          asset="gitleaks_${version}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${asset}"
          curl -fsSL -o "${asset}" "${url}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${asset}" | sha256sum -c -
          tar -xzf "${asset}" gitleaks
          install -m 0755 gitleaks "${RUNNER_TEMP}/gitleaks"
          "${RUNNER_TEMP}/gitleaks" version

      - name: Scan history
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/gitleaks" detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --log-opts="--all" \
            --exit-code 1
