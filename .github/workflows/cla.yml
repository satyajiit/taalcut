# contributor-assistant/github-action v2.6.1, pinned by commit.
# That repository was archived on 2026-03-23 and is read-only. See CONTRIBUTING.md.
# Do not check out pull-request code. pull_request_target plus a checkout of
# the PR head is unsafe, and this action does not need a checkout.

name: 'CLA Assistant'
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# The agreement is still a draft. Do not collect signatures or enforce it.
# Enabling this job and restoring its required permissions need an approved
# agreement, named legal entity, and the setup recorded in CONTRIBUTING.md.
permissions: {}

jobs:
  CLAAssistant:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - name: 'CLA Assistant'
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Machine-user PAT, added by a person as a repository secret. Not created here.
          # GITHUB_TOKEN cannot push the signature file onto cla-signatures.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/satyajiit/taalcut/blob/main/CLA.md'
          # Must stay unprotected. Do not create signatures/version1/cla.json by hand.
          branch: cla-signatures
          allowlist: dependabot[bot],github-actions[bot]
