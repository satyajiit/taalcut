# UI strings for the renderer and packages/ui live in one catalogue:
# apps/renderer/src/locales. Both packages' i18n:check scripts run this command.
# Setup only installs pnpm and Node, so this job can use the Linux runner.
# It also runs the repo scripts' own tests (i18n, NOTICE, licence scan): the
# licence-scan job stops at its scan step while a rejection is listed.
name: i18n

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: catalogues
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check catalogues
        run: node scripts/i18n.mjs check

      - name: Script tests
        run: pnpm test:scripts
