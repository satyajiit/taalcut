name: Nightly e2e with on-device assets

# The e2e projects that need what a user's Mac downloads or builds before it indexes or renders (gate, make,
# indexing, and the app project's durability tests, which skip without FFmpeg in CI's PR smoke): the components
# from components.taalcut.app (the signed manifest's, for the hardware tiers, the render engine's headless shell
# among them), FFmpeg from tools/ffmpeg's build and the mac helper from native/mac-helper's.
# apps/desktop/e2e/provision-assets.ts provisions them; the components and FFmpeg are cached by their inputs (the
# manifest's sequence and the files' sha256s; FFmpeg's build inputs).
# CI's PR job runs the e2e projects that need none of them. Nightly and on demand only: macOS minutes are billed
# at 10x.
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-assets-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e-assets:
    name: e2e with on-device assets
    runs-on: macos-26
    # A cold FFmpeg build plus the components' download, then the app, gate, make and indexing projects.
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Cache keys
        id: keys
        run: pnpm --silent --filter @taalcut/desktop e2e:provision -- --keys >> "$GITHUB_OUTPUT"
      - name: Components cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/Taalcut-dev/components
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.components }}
      - name: FFmpeg cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/ffmpeg/dist
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.ffmpeg }}
      - name: Provision the components, the headless shell, FFmpeg and the mac helper
        run: pnpm --filter @taalcut/desktop e2e:provision -- --install-build-tools
      - name: App, gate, make and indexing e2e
        run: pnpm --filter @taalcut/desktop e2e:assets
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-assets-results
          if-no-files-found: ignore
          path: apps/desktop/test-results
